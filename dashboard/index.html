<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quillfeather Capital – Data Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Quillfeather Capital <span>– Data Dashboard</span></h1>
      <div id="counts" class="counts"></div>
    </div>
  </header>
  <main class="wrap">
    <section class="controls">
      <input id="q" type="search" placeholder="Search emails, events, repos, issues and pages…" autofocus>
      <div id="services" class="services"></div>
    </section>
    <div id="warnings"></div>
    <div id="summary" class="summary">Loading…</div>
    <div id="results"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
